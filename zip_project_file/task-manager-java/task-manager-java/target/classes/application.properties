# Server
server.port=5000

# ---------- Default: H2 in-memory DB ----------
spring.datasource.url=jdbc:h2:mem:tasksdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console: http://localhost:5000/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- OPTIONAL: use SQLite instead of H2 ----------
# Comment the H2 lines above and uncomment the following:
# spring.datasource.url=jdbc:sqlite:./tasks.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# spring.jpa.hibernate.ddl-auto=update