<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager (Java)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:20px; }
    .box { max-width:700px; margin:0 auto; background:#fff; padding:20px; border:1px solid #ddd; }
    h1 { margin-top:0; font-size:24px; }
    label { display:block; margin-top:10px; font-size:14px; }
    input, select, textarea, button { width:100%; padding:8px; margin-top:4px;
        box-sizing:border-box; font-size:14px; }
    button { margin-top:12px; cursor:pointer; background:#333; color:#fff; border:none; }
    button:hover { background:#555; }
    .task { border-top:1px solid #eee; padding:12px 0; }
    .task h3 { margin:0 0 6px 0; font-size:16px; }
    .meta { color:#666; font-size:13px; margin-bottom:8px; }
    .row { display:flex; gap:8px; }
    .row button { width:auto; flex:1; margin-top:0; }
    .btn-del { background:#a33; }
    .error { color:#a33; margin-top:10px; }
    .ok { color:#2a6; margin-top:10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>My Task Manager (Java / Spring Boot)</h1>
    <p>Add your tasks below. You can also mark them done or delete them.</p>

    <h2>Add new task</h2>
    <label>Title</label>
    <input id="title" type="text" placeholder="e.g. Finish homework" />

    <label>Description</label>
    <textarea id="description" rows="2" placeholder="optional"></textarea>

    <label>Status</label>
    <select id="status">
      <option value="pending">pending</option>
      <option value="in_progress">in_progress</option>
      <option value="done">done</option>
    </select>

    <label>Priority</label>
    <select id="priority">
      <option value="low">low</option>
      <option value="medium" selected>medium</option>
      <option value="high">high</option>
    </select>

    <button onclick="addTask()">Add Task</button>
    <div id="msg"></div>

    <h2>All tasks</h2>
    <div id="list">Loading...</div>
  </div>

  <script>
    function showMsg(text, ok) {
      const el = document.getElementById("msg");
      el.className = ok ? "ok" : "error";
      el.innerText = text;
    }

    function escapeHtml(s) {
      return (s ?? "").toString()
        .replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }

    async function loadTasks() {
      const list = document.getElementById("list");
      try {
        const res = await fetch("/api/tasks");
        const tasks = await res.json();

        if (!tasks.length) { list.innerHTML = "<p>No tasks yet.</p>"; return; }

        let html = "";
        for (const t of tasks) {
          html += `
            <div class="task">
              <h3>${escapeHtml(t.title)}</h3>
              <div class="meta">#${t.id} | status: ${escapeHtml(t.status)} | priority: ${escapeHtml(t.priority)}</div>
              <div>${escapeHtml(t.description)}</div>
              <div class="row" style="margin-top:8px;">
                <button onclick="markDone(${t.id})">Mark Done</button>
                <button class="btn-del" onclick="deleteTask(${t.id})">Delete</button>
              </div>
            </div>`;
        }
        list.innerHTML = html;
      } catch (e) {
        list.innerHTML = "<p class='error'>Could not load tasks. Is the server running?</p>";
      }
    }

    async function addTask() {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value;
      const status = document.getElementById("status").value;
      const priority = document.getElementById("priority").value;

      if (!title) { showMsg("Please enter a title", false); return; }

      const res = await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, description, status, priority }),
      });

      const data = await res.json();
      if (!res.ok) {
        showMsg(data.error || (data.details && Object.values(data.details)[0]) || "Could not add task", false);
        return;
      }

      document.getElementById("title").value = "";
      document.getElementById("description").value = "";
      showMsg("Task added!", true);
      loadTasks();
    }

    async function markDone(id) {
      const res = await fetch("/api/tasks/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "done" }),
      });
      if (!res.ok) {
        const data = await res.json();
        showMsg(data.error || "Update failed", false);
        return;
      }
      showMsg("Task marked as done", true);
      loadTasks();
    }

    async function deleteTask(id) {
      if (!confirm("Delete this task?")) return;
      const res = await fetch("/api/tasks/" + id, { method: "DELETE" });
      if (!res.ok) {
        const data = await res.json();
        showMsg(data.error || "Delete failed", false);
        return;
      }
      showMsg("Task deleted", true);
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
